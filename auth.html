<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voltix | Secure Access Gateway</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --accent: #06b6d4;
            --bg-dark: #090d16;
            --card-bg: rgba(17, 24, 39, 0.75);
            --border-color: rgba(255, 255, 255, 0.08);
            --input-bg: rgba(15, 23, 42, 0.6);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            background-color: var(--bg-dark);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .bg-glow-top {
            position: absolute;
            top: -15%;
            left: 50%;
            transform: translateX(-50%);
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.25) 0%, rgba(0,0,0,0) 70%);
            border-radius: 50%;
            filter: blur(90px);
            animation: pulseGlow 8s infinite alternate ease-in-out;
        }

        .bg-glow-bottom {
            position: absolute;
            bottom: -20%;
            right: -10%;
            width: 550px;
            height: 550px;
            background: radial-gradient(circle, rgba(6, 182, 212, 0.2) 0%, rgba(0,0,0,0) 70%);
            border-radius: 50%;
            filter: blur(90px);
        }

        @keyframes pulseGlow {
            0% { transform: translateX(-50%) scale(0.9); opacity: 0.7; }
            100% { transform: translateX(-50%) scale(1.1); opacity: 1; }
        }

        .auth-card {
            background: var(--card-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 44px 40px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.7),
                        0 0 40px rgba(99, 102, 241, 0.12);
            z-index: 10;
            position: relative;
        }

        .brand-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .brand-logo {
            font-size: 32px;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff 0%, #a5b4fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            letter-spacing: -0.5px;
        }

        .brand-logo i {
            color: var(--accent);
            -webkit-text-fill-color: initial;
            filter: drop-shadow(0 0 10px rgba(6, 182, 212, 0.5));
        }

        .brand-subtitle {
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 400;
            margin-top: 6px;
        }

        .tab-switcher {
            display: flex;
            background: rgba(15, 23, 42, 0.7);
            padding: 6px;
            border-radius: 14px;
            margin-bottom: 28px;
            border: 1px solid var(--border-color);
        }

        .tab-btn {
            flex: 1;
            padding: 11px 0;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 14px;
            border-radius: 10px;
            cursor: pointer;
        }

        .tab-btn.active {
            background: var(--primary);
            color: #ffffff;
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.4);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            color: var(--text-main);
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
            letter-spacing: 0.2px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 16px;
            color: var(--text-muted);
            font-size: 15px;
            pointer-events: none;
        }

        .form-control {
            width: 100%;
            padding: 14px 16px 14px 46px;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
        }

        .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 18px rgba(99, 102, 241, 0.25);
            background: rgba(15, 23, 42, 0.85);
        }

        .form-control::placeholder {
            color: #475569;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-hover) 100%);
            border: none;
            border-radius: 12px;
            color: #ffffff;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.5);
            margin-top: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px -5px rgba(99, 102, 241, 0.7);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .form-container {
            display: none;
        }

        .form-container.active {
            display: block;
            animation: fadeIn 0.35s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .swal2-popup {
            background: #111827 !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            border-radius: 20px !important;
            color: #f8fafc !important;
        }
        .swal2-title {
            color: #ffffff !important;
        }
    </style>
</head>
<body>

    <div class="bg-glow-top"></div>
    <div class="bg-glow-bottom"></div>

    <div class="auth-card">
        <div class="brand-header">
            <div class="brand-logo">
                <i class="fa-solid fa-bolt-lightning"></i> Voltix
            </div>
            <p class="brand-subtitle">Enter your credentials to access your account</p>
        </div>

        <div class="tab-switcher">
            <button class="tab-btn active" id="btn-login-tab" onclick="switchTab('login')">Sign In</button>
            <button class="tab-btn" id="btn-register-tab" onclick="switchTab('register')">Create Account</button>
        </div>

        <!-- Login Form -->
        <div id="login-form" class="form-container active">
            <form onsubmit="handleAuth(event, 'login')">
                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <div class="input-wrapper">
                        <i class="fa-regular fa-envelope input-icon"></i>
                        <input type="email" id="login-email" class="form-control" placeholder="admin@voltix.com" required>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <input type="password" id="login-password" class="form-control" placeholder="••••••••" required>
                    </div>
                </div>
                <button type="submit" class="btn-submit">
                    <span>Sign In</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </button>
            </form>
        </div>

        <!-- Register Form -->
        <div id="register-form" class="form-container">
            <form onsubmit="handleAuth(event, 'register')">
                <div class="form-group">
                    <label class="form-label">Full Name</label>
                    <div class="input-wrapper">
                        <i class="fa-regular fa-user input-icon"></i>
                        <input type="text" id="reg-name" class="form-control" placeholder="John Doe" required>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <div class="input-wrapper">
                        <i class="fa-regular fa-envelope input-icon"></i>
                        <input type="email" id="reg-email" class="form-control" placeholder="user@voltix.com" required>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">Password (Min. 6 characters)</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <input type="password" id="reg-password" class="form-control" placeholder="••••••••" minlength="6" required>
                    </div>
                </div>
                <button type="submit" class="btn-submit">
                    <span>Get Started</span>
                    <i class="fa-solid fa-user-plus"></i>
                </button>
            </form>
        </div>
    </div>

    <script>
        function switchTab(type) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.form-container').forEach(f => f.classList.remove('active'));

            if (type === 'login') {
                document.getElementById('btn-login-tab').classList.add('active');
                document.getElementById('login-form').classList.add('active');
            } else {
                document.getElementById('btn-register-tab').classList.add('active');
                document.getElementById('register-form').classList.add('active');
            }
        }

        async function handleAuth(event, type) {
            event.preventDefault();

            let payload = {};
            if (type === 'login') {
                payload = {
                    email: document.getElementById('login-email').value.trim(),
                    password: document.getElementById('login-password').value
                };
            } else {
                payload = {
                    name: document.getElementById('reg-name').value.trim(),
                    email: document.getElementById('reg-email').value.trim(),
                    password: document.getElementById('reg-password').value,
                    role: 'user' // تم تعديلها إلى user لتقبلها القاعدة
                };
            }

            Swal.fire({
                title: 'Authenticating...',
                text: 'Please wait while we process your request',
                allowOutsideClick: false,
                didOpen: () => { Swal.showLoading(); }
            });

            try {
                const targetUrl = `api/auth.php?action=${type}`;
                
                const response = await fetch(targetUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    if (type === 'register') {
                        Swal.fire({
                            icon: 'success',
                            title: 'Account Created!',
                            text: data.message || 'You can now sign in with your new account.',
                            confirmButtonColor: '#6366f1'
                        }).then(() => {
                            switchTab('login');
                            document.getElementById('login-email').value = payload.email;
                        });
                    } else if (type === 'login') {
                        Swal.fire({
                            icon: 'success',
                            title: 'Welcome Back!',
                            text: 'Redirecting to your dashboard...',
                            timer: 1200,
                            showConfirmButton: false
                        }).then(() => {
                            const userRole = data.user ? data.user.role : 'user';
                            if (userRole === 'admin') {
                                window.location.href = 'admin.html';
                            } else {
                                window.location.href = 'index.html';
                            }
                        });
                    }
                } else {
                    Swal.fire({
                        icon: 'error',
                        title: 'Authentication Failed',
                        text: data.message || 'Invalid credentials or request error.',
                        confirmButtonColor: '#6366f1'
                    });
                }
            } catch (err) {
                console.error(err);
                Swal.fire({
                    icon: 'error',
                    title: 'Connection Error',
                    text: 'Unable to connect to api/auth.php. Please make sure Apache and MySQL are running.',
                    confirmButtonColor: '#6366f1'
                });
            }
        }
    </script>
</body>
</html>
